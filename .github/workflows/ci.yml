name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Toolchain
        run: swift --version
      - name: Test
        run: |
          set -o pipefail
          make test 2>&1 | tee test.log
      - name: Report failing tests as annotations
        if: failure()
        run: |
          grep -E "recorded an issue|Expectation failed|error:" test.log | head -40 | while IFS= read -r line; do
            echo "::error title=Test failure::${line}"
          done
      - name: Coverage
        run: make coverage
      - name: Bundle app
        run: make app
      - name: Verify signature and sandbox entitlement
        run: |
          codesign --verify --strict build/AsterMark.app
          codesign -d --entitlements - build/AsterMark.app 2>/dev/null | grep -q app-sandbox
